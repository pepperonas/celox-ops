services:
  db:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    volumes:
      - invoice_data:/data
    env_file: .env
    # Geschaeftszeitzone: haelt Logs, Dateinamen und localtime-Bibliotheken
    # deutsch. Die Geschaeftslogik selbst ist ueber services/business_time.py
    # schon unabhaengig davon korrekt (frueher lieferte date.today() im
    # UTC-Container zwischen 00:00 und 02:00 den Vortag).
    environment:
      TZ: Europe/Berlin
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      # Loopback-only: 8090 ist nur für den System-nginx (ops.celox.io) gedacht,
      # nicht fürs offene Internet (Härtung 2026-07-19, war auf dem VPS hotgefixt)
      - "127.0.0.1:8090:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  invoice_data:
